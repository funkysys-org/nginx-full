name: build

on:
  push:
    branches: [main]
    paths:
      - 'vendor/**'
      - 'scripts/**'
      - 'parity/**'
      - 'app/**'
      - 'overlay/**'
      - 'modsec/**'
      - 'rootfs-s6/**'
      - 'test-runtime/**'
      - 'base-debrand.patch'
      - 'docker-compose.waf-test.yml'
      - '.github/workflows/build.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'   # weekly drift check

env:
  # OUR pins now — this repo owns the base build (Phase A sovereignty).
  OPENRESTY_VERSION: '1.31.8.1'
  NODE_MAJOR: '26'
  LUA_VERSION: '5.1.5'
  LUAROCKS_VERSION: '3.13.0'
  NPM_VERSION: '2.17.0'   # app-layer pin (A1) + parity reference
  NPM_COMMIT: '5c8aec9bdeca0a2fb6a71e060ec598aa6eddd186'   # the v2.17.0 tag sha (label metadata)
  NGINX_FULL_COMMIT: '38654e0738a6c19578e0045678480622e48473878c'  # vendored base tree (PROVENANCE-gated)
  # WAF layer (A2b — the former npm-modsec repo, merged here)
  MODSEC_VERSION: '3.0.17'
  MODSEC_NGINX_VERSION: '1.0.4'
  CRS_VERSION: 'v4.30.0'
  VTS_VERSION: 'v0.2.7'
  CACHE_PURGE_VERSION: '3.0.4'
  # brotli: libbrotli at the CVE-2026-111497 fix tag; the module repo has no
  # usable tags — pinned by commit SHA (pins-sync checks both against the ARGs)
  BROTLI_VERSION: 'v1.2.1'
  BROTLI_MODULE_SHA: '53e0fb55f250f48fe80c0ddbf6c0f7103cdbaae1'
  WAF_BUILD_JOBS: '4'
  NODE_FLOOR: '26.12.1'  # Broccoli2Shell / CVE-2026-111497 fix line
  IMAGE: ghcr.io/funkysys-org/nginx-full

permissions:
  contents: read
  packages: write

jobs:
  pins-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert workflow pins match the vendored bake hcl
        run: |
          set -eu
          for pin in OPENRESTY_VERSION NODE_MAJOR LUA_VERSION LUAROCKS_VERSION; do
            wf=$(printenv "$pin")
            hcl=$(awk -v p="$pin" '
              $0 ~ "^variable \"" p "\" {" { inblock=1; next }
              inblock && /default/ { gsub(/^.*default = "/, ""); gsub(/".*$/, ""); print; exit }
            ' vendor/docker-nginx-full/docker/docker-bake.hcl)
            [ "$wf" = "$hcl" ] || { echo "::error::PIN MISMATCH ${pin}: workflow='${wf}' vendored-hcl='${hcl}'"; exit 1; }
          done
          df=$(sed -n 's/^ARG NPM_VERSION=//p' app/Dockerfile)
          [ "$NPM_VERSION" = "$df" ] || { echo "::error::PIN MISMATCH NPM_VERSION: workflow='${NPM_VERSION}' app/Dockerfile='${df}'"; exit 1; }
          prov_sha=$(sed -n 's/^| Commit | \(.*\) |$/\1/p' vendor/npm/PROVENANCE.md | tr -d ' ')
          [ "$NPM_COMMIT" = "$prov_sha" ] || { echo "::error::PROVENANCE MISMATCH: workflow NPM_COMMIT='${NPM_COMMIT}' vendored tree='${prov_sha}' — re-vendor or fix the pin"; exit 1; }
          base_sha=$(sed -n 's/^| Commit | \(.*\) |$/\1/p' vendor/docker-nginx-full/PROVENANCE.md | tr -d ' ')
          [ "$NGINX_FULL_COMMIT" = "$base_sha" ] || { echo "::error::PROVENANCE MISMATCH: workflow NGINX_FULL_COMMIT='${NGINX_FULL_COMMIT}' vendored base tree='${base_sha}' — re-vendor or fix the pin"; exit 1; }
          for pin in MODSEC_VERSION MODSEC_NGINX_VERSION CRS_VERSION VTS_VERSION CACHE_PURGE_VERSION BROTLI_VERSION BROTLI_MODULE_SHA; do
            wf=$(printenv "$pin")
            df=$(sed -n "s/^ARG ${pin}=//p" overlay/Dockerfile)
            [ "$wf" = "$df" ] || { echo "::error::PIN MISMATCH ${pin}: workflow='${wf}' overlay/Dockerfile='${df}'"; exit 1; }
          done
          echo "pins in sync (workflow == vendored bake defaults + app/Dockerfile + overlay/Dockerfile)"

  build:
    needs: pins-sync
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the vendored base chain (certbot-node variant)
        run: |
          set -eu
          # Proxywarden base debrand: the ONLY sanctioned delta on this tree
          # (PROVENANCE rule) — LABELS only, applied build-time. The tree
          # itself stays byte-faithful to the pinned upstream commit.
          # Apply FROM THE REPO ROOT: git apply from a subdirectory SILENTLY
          # IGNORES paths outside it — the previous form (cd vendor/... then
          # git apply ../../base-debrand.patch) exited 0 and patched NOTHING,
          # shipping upstream LABELS while every gate stayed green (parity
          # passes on a virgin tree by definition; the old smoke gate was
          # vacuous). Root-relative patch paths + assertion, or nothing.
          git apply base-debrand.patch
          grep -q 'funkysys-org' vendor/docker-nginx-full/docker/Dockerfile.certbot-node \
            || { echo "::error::base-debrand.patch applied NOTHING (silent no-op) — dying"; exit 1; }
          echo "[instrument] tree state at build time (must be funkysys-org):"
          grep -n 'maintainer=' vendor/docker-nginx-full/docker/Dockerfile.certbot-node
          cd vendor/docker-nginx-full
          # Mirrors upstream's scripts/bake.sh invocation: explicit bake file
          # from the project root + a dedicated buildx builder (container
          # driver). We export to the docker store so the gates run BEFORE
          # anything is published.
          docker buildx create --name nginxfull || true
          docker buildx use nginxfull
          docker buildx bake \
            --file docker/docker-bake.hcl \
            --progress=plain \
            --var DOCKER_IMAGE="${IMAGE}" \
            --var OPENRESTY_VERSION="${OPENRESTY_VERSION}" \
            --var NODE_MAJOR="${NODE_MAJOR}" \
            --var LUA_VERSION="${LUA_VERSION}" \
            --var LUAROCKS_VERSION="${LUAROCKS_VERSION}" \
            --set "common.platforms=linux/amd64" \
            --set "certbot-node.output=type=docker" \
            certbot-node
          docker image inspect "${IMAGE}:certbot-node" >/dev/null
          echo "[instrument] baked base labels:"
          docker inspect "${IMAGE}:certbot-node" --format '{{json .Config.Labels}}'

      - name: Parity gate (vs official image + committed oracle)
        run: |
          set -eu
          bash scripts/parity-check.sh "${IMAGE}:certbot-node"

      - name: Node security floor (we ship the Node now)
        run: |
          set -eu
          node_v=$(docker run --rm --entrypoint /usr/bin/node "${IMAGE}:certbot-node" --version)
          node_v=${node_v#v}
          echo "base image Node: ${node_v} (floor: ${NODE_FLOOR})"
          IFS='.' read -r a b c <<< "$node_v"
          IFS='.' read -r x y z <<< "$NODE_FLOOR"
          if [ "$((a*10000+b*100+c))" -lt "$((x*10000+y*100+z))" ]; then
            echo "::error::Node ${node_v} below floor ${NODE_FLOOR} — bump NODE_MAJOR/re-vendor."
            exit 1
          fi

      - name: Build the NPM-equivalent app image (A1)
        run: |
          set -eu
          APP_TAG="${NPM_VERSION}-or${OPENRESTY_VERSION}"
          # The app builds under a tag that is NEVER PUBLISHED (":app-build"):
          # BuildKit resolves a FROM-tag from the REGISTRY whenever the tag
          # exists there — the WAF overlay was therefore consuming the STALE
          # published app digest instead of the fresh local one (the same-tag
          # race INSIDE one run; proven by the [instrument] lines: base+app
          # funkysys, WAF = the previous run's labels). A never-published tag
          # can only resolve locally. The real tag is applied at push time.
          docker build \
            --build-arg BASE_IMAGE="${IMAGE}:certbot-node" \
            --build-arg NPM_VERSION="${NPM_VERSION}" \
            --build-arg BUILD_COMMIT="${NPM_COMMIT}" \
            --build-arg BUILD_DATE="$(date '+%Y-%m-%d %T %Z')" \
            -t "${IMAGE}:app-build" \
            -f app/Dockerfile .
          echo "[instrument] app labels:"
          docker inspect "${IMAGE}:app-build" --format '{{json .Config.Labels}}'

      - name: App smoke (boots, stock UI served, nginx -t)
        run: |
          set -eu
          APP_TAG="${NPM_VERSION}-or${OPENRESTY_VERSION}"
          # The stock prepare service HARD-FAILS unless both /data and
          # /etc/letsencrypt are mounts — run the image like the real world does.
          docker volume create appsmoke-data >/dev/null
          docker volume create appsmoke-le >/dev/null
          docker run -d --name appsmoke -p 127.0.0.1:8081:81 \
            -v appsmoke-data:/data -v appsmoke-le:/etc/letsencrypt \
            "${IMAGE}:app-build"
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:8081/ >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:8081/ | grep -q 'Nginx Proxy Manager' \
            || { echo '::error::UI not reachable / stock frontend not served'; docker logs appsmoke 2>&1 | tail -30; exit 1; }
          docker exec appsmoke nginx -t
          docker rm -f appsmoke >/dev/null
          docker volume rm appsmoke-data appsmoke-le >/dev/null
          echo "APP SMOKE OK: NPM-equivalent image boots, stock UI on :81, nginx -t clean"

      - name: Build the WAF overlay image (A2b)
        run: |
          set -eu
          APP_TAG="${NPM_VERSION}-or${OPENRESTY_VERSION}"
          WAF_TAG="${APP_TAG}-modsec${MODSEC_VERSION}-crs${CRS_VERSION#v}-vts${VTS_VERSION#v}-purge${CACHE_PURGE_VERSION}-brotli${BROTLI_VERSION#v}"
          docker build -f overlay/Dockerfile \
            --build-arg WAF_BASE_IMAGE="${IMAGE}:app-build" \
            --build-arg OPENRESTY_VERSION \
            --build-arg MODSEC_VERSION \
            --build-arg MODSEC_NGINX_VERSION \
            --build-arg CRS_VERSION \
            --build-arg VTS_VERSION \
            --build-arg CACHE_PURGE_VERSION \
            --build-arg BROTLI_VERSION \
            --build-arg BROTLI_MODULE_SHA \
            --build-arg BUILD_JOBS="${WAF_BUILD_JOBS}" \
            -t "${IMAGE}:${WAF_TAG}" .

      
                    echo "[instrument] waf labels:"
          docker inspect "${IMAGE}:${WAF_TAG}" --format '{{json .Config.Labels}}'

      - name: WAF smoke (payload matrix)
        run: |
          set -eu
          APP_TAG="${NPM_VERSION}-or${OPENRESTY_VERSION}"
          WAF_TAG="${APP_TAG}-modsec${MODSEC_VERSION}-crs${CRS_VERSION#v}-vts${VTS_VERSION#v}-purge${CACHE_PURGE_VERSION}-brotli${BROTLI_VERSION#v}"
          WAF_IMAGE="${IMAGE}:${WAF_TAG}" docker compose -f docker-compose.waf-test.yml up -d
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8181/ >/dev/null 2>&1 && break; sleep 2; done
          bash scripts/waf-smoke.sh
          docker compose -f docker-compose.waf-test.yml down -v

      - name: Push (pins in the tags, no floating tags)
        run: |
          set -eu
          BASE_TAG="${IMAGE}:certbot-node-or${OPENRESTY_VERSION}-node${NODE_MAJOR}"
          docker tag "${IMAGE}:certbot-node" "$BASE_TAG"
          docker push "$BASE_TAG"
          docker tag "${IMAGE}:app-build" "${IMAGE}:${NPM_VERSION}-or${OPENRESTY_VERSION}"
          docker push "${IMAGE}:${NPM_VERSION}-or${OPENRESTY_VERSION}"
          APP_TAG="${NPM_VERSION}-or${OPENRESTY_VERSION}"
          WAF_TAG="${APP_TAG}-modsec${MODSEC_VERSION}-crs${CRS_VERSION#v}-vts${VTS_VERSION#v}-purge${CACHE_PURGE_VERSION}-brotli${BROTLI_VERSION#v}"
          docker push "${IMAGE}:${WAF_TAG}"

  drift-check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Has upstream moved (openresty / NPM source)?
        run: |
          set -eu
          or_latest=$(git ls-remote --tags --refs https://github.com/openresty/openresty 'refs/tags/v*' \
            | sed 's|.*refs/tags/v||' | sort -V | tail -1)
          npm_latest=$(git ls-remote --tags --refs https://github.com/NginxProxyManager/nginx-proxy-manager 'refs/tags/v2*' \
            | sed 's|.*refs/tags/v||' | sort -V | tail -1)
          dnf_master=$(git ls-remote https://github.com/nginxproxymanager/docker-nginx-full refs/heads/master | cut -f1)
          echo "openresty latest: ${or_latest} | our pin: ${OPENRESTY_VERSION}"
          echo "NPM source latest: ${npm_latest} | our pin: ${NPM_VERSION}"
          echo "docker-nginx-full master: ${dnf_master:0:12} | vendored: ${NGINX_FULL_COMMIT:0:12}"
          if [ "$or_latest" != "$OPENRESTY_VERSION" ] || [ "$npm_latest" != "$NPM_VERSION" ] || [ "$dnf_master" != "$NGINX_FULL_COMMIT" ]; then
            echo "::error::UPSTREAM MOVED (openresty ${or_latest} / NPM ${npm_latest} / base tree ${dnf_master:0:12}). Pins are a human decision — bump in workflow env AND vendored bake defaults, rebuild, re-run the parity gate."
            exit 1
          fi
          echo "no drift — pins current"
